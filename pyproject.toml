[project]
name = "inference-control-plane"
version = "0.1.2"
description = "Reusable inference observability and optimization control plane"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "inference-control-plane contributors" },
]
maintainers = [
    { name = "inference-control-plane contributors" },
]
keywords = [
    "llm",
    "inference",
    "vllm",
    "observability",
    "monitoring",
    "optimization",
    "helicone",
    "langfuse",
    "opentelemetry",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = ["httpx>=0.26.0", "pydantic>=2.5.0"]

[project.urls]
Homepage = "https://github.com/yavuzhansarmaz/inference-control-plane"
Repository = "https://github.com/yavuzhansarmaz/inference-control-plane"
Issues = "https://github.com/yavuzhansarmaz/inference-control-plane/issues"
Changelog = "https://github.com/yavuzhansarmaz/inference-control-plane/blob/main/CHANGELOG.md"
Documentation = "https://github.com/yavuzhansarmaz/inference-control-plane#readme"

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0", "pytest-cov>=5.0", "ruff>=0.8.0", "build>=1.0", "twine>=5.0"]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=inference_control_plane --cov-report=term-missing"

[tool.coverage.run]
source = ["inference_control_plane"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
